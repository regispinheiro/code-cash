           /*
        Verifique uma lista de número de 1 a 100;

        - se o número for divisivel por 2, imprima "n - MAR"
        - se o número for divisível por 5, imprima "n - MENINO"
        - se divisível por 2 e por 5, imprima "n - MARMENINO"
      */

      for (let i = 1; i <= 100; i = i + 1) {
        if (i % 2 === 0) {
          if (i % 5 === 0) {
            console.log(`${i} - MARMENINO`);
          } else {
            console.log(`${i} - MAR`);
          }
        } else if (i % 5 === 0) {
          console.log(`${i} - MENINO`);
        }
      }
